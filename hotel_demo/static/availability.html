<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14日只读房态</title><link rel="stylesheet" href="/styles.css"><script src="/availability.js" defer></script></head>
<body><main class="page-shell"><a href="/">返回事务演示</a><h1>14日只读房态</h1><p>合成库存快照 · 不显示客人记录 · 不创建或取消预订</p>
<form id="view-form"><div class="form-row"><label>策略<select name="mode"><option value="strict">严格房型</option><option value="upgrade">允许升级</option><option value="protected_upgrade">保护库存升级</option></select></label><label>窗口开始<input name="start" type="date" required></label></div><button class="button button-primary">刷新14日快照</button></form>
<p id="status" role="status"></p><p>保护线只限制升级，原生高档需求可以使用；它不是当前锁定的房间数。其他策略的生效保护量为0。范围外显示“无库存数据”，不假定有房或零房。</p>
<div class="table-scroll"><table class="inventory-table"><thead><tr><th>日期</th><th>房型：剩余 / 生效保护（配置）</th><th>加床 / 婴儿床剩余</th></tr></thead><tbody id="days"></tbody></table></div>
<section class="panel"><h2>试算连续入住</h2><p>只在当前策略库的新快照中检查同房、床型、人数、儿童年龄、辅助资源、升级授权和预算。不会保留房间，也不是预订承诺。</p>
<form id="preview-form"><div class="form-row"><label>入住<input name="check_in" type="date" required></label><label>离店<input name="check_out" type="date" required></label><label>房型<select name="room_type"></select></label><label>床型<select name="bed"></select></label><label>成人<input name="adults" type="number" min="1" value="2" required></label><label>儿童年龄<input name="child_ages" placeholder="如 1,8；没有则留空"></label><label>升级预算（分）<input name="budget" type="number" min="0" value="100000" required></label><label>允许升级<select name="allow_upgrade"><option>true</option><option>false</option></select></label><label>允许加床<select name="allow_extra_bed"><option>true</option><option>false</option></select></label></div><button class="button button-outline">只读试算，不下单</button></form><p id="preview" role="status">尚未试算</p></section></main></body></html>
